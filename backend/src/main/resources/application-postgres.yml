spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/forgeflow}
    username: ${DB_USER:forgeflow}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/postgresql
