# Loaded in http context. Unsafe requests require the exact suite origin.
map "$request_method:$http_origin" $forgeflow_showcase_bad_origin {
    default 1;
    ~^(GET|HEAD|OPTIONS): 0;
    "POST:https://forge-flow.de" 0;
    "PUT:https://forge-flow.de" 0;
    "PATCH:https://forge-flow.de" 0;
    "DELETE:https://forge-flow.de" 0;
}
