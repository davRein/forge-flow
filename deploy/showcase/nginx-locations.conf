location = /_forgeflow_showcase_access {
    internal;
    proxy_pass http://127.0.0.1:3001/api/v1/auth/showcase-session?app=$forgeflow_showcase_app;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}
location = /knowledge-hub {
    set $forgeflow_showcase_app knowledgeHub;
    auth_request /_forgeflow_showcase_access;
    proxy_pass http://127.0.0.1:3300;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie $http_cookie;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    proxy_read_timeout 60s;
}
location ^~ /knowledge-hub/ {
    set $forgeflow_showcase_app knowledgeHub;
    auth_request /_forgeflow_showcase_access;
    proxy_pass http://127.0.0.1:3300;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie $http_cookie;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    proxy_read_timeout 60s;
}
location = /knowledge-hub-api { return 404; }
location ^~ /knowledge-hub-api/ {
    if ($forgeflow_showcase_bad_origin) { return 403; }
    set $forgeflow_showcase_app knowledgeHub;
    auth_request /_forgeflow_showcase_access;
    client_max_body_size 11m;
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-ForgeFlow-Mode suite;
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_buffering off;
}
location = /flowpilot { return 308 /flowpilot/; }
location ^~ /flowpilot/ {
    set $forgeflow_showcase_app flowPilot;
    auth_request /_forgeflow_showcase_access;
    alias /var/www/forgeflow-showcase/current/;
    index index.html;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors https://forge-flow.de" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-cache always;
}
location = /flowpilot-api { return 404; }
location ^~ /flowpilot-api/ {
    if ($forgeflow_showcase_bad_origin) { return 403; }
    set $forgeflow_showcase_app flowPilot;
    auth_request /_forgeflow_showcase_access;
    client_max_body_size 128k;
    proxy_pass http://127.0.0.1:8001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-ForgeFlow-Mode suite;
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
}
location = /pulsewatch { return 308 /pulsewatch/; }
location ^~ /pulsewatch/ {
    set $forgeflow_showcase_app pulseWatch;
    auth_request /_forgeflow_showcase_access;
    proxy_pass http://127.0.0.1:3302/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors https://forge-flow.de" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-cache always;
}
location = /pulsewatch-api { return 404; }
location ^~ /pulsewatch-api/ {
    if ($forgeflow_showcase_bad_origin) { return 403; }
    set $forgeflow_showcase_app pulseWatch;
    auth_request /_forgeflow_showcase_access;
    auth_request_set $forgeflow_user_id $upstream_http_x_forgeflow_user_id;
    proxy_pass http://127.0.0.1:8082/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "PULSEWATCH_SESSION=$cookie_PULSEWATCH_SESSION";
    proxy_set_header X-ForgeFlow-User-Id $forgeflow_user_id;
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
}

location = /datascout { return 308 /datascout/; }
location ^~ /datascout/ {
    set $forgeflow_showcase_app dataScout;
    auth_request /_forgeflow_showcase_access;
    alias /var/www/forgeflow-showcase/current/datascout/;
    index index.html;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors https://forge-flow.de; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-cache always;
}
location = /datascout-api { return 404; }
location ^~ /datascout-api/ {
    if ($forgeflow_showcase_bad_origin) { return 403; }
    set $forgeflow_showcase_app dataScout;
    auth_request /_forgeflow_showcase_access;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8002/;
    proxy_set_header Host $host;
    proxy_set_header Cookie "FORGEFLOW_SESSION=$cookie_FORGEFLOW_SESSION";
    proxy_set_header X-ForgeFlow-User-Id "";
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_next_upstream off;
}
