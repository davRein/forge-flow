name: forgeflow-showcase
x-service: &service
  restart: unless-stopped
  network_mode: host
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 100
  tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777']
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: '3'}
services:
  hub-api:
    <<: *service
    image: forgeflow-showcase-hub-api:${RELEASE_ID:?}
    build:
      context: ./hub-api
      dockerfile: Dockerfile
      args: {PYTHON_IMAGE: '${PYTHON_IMAGE:?}'}
    env_file: [/etc/forgeflow/showcase/knowledge.env]
    command: [python, -m, uvicorn, 'app.main:app', --host, 127.0.0.1, --port, '8000', --no-access-log, --no-proxy-headers]
    mem_limit: 512m
    cpus: 0.75
  hub-web:
    <<: *service
    image: forgeflow-showcase-hub-web:${RELEASE_ID:?}
    build:
      context: ./hub-web
      dockerfile: Dockerfile
      args: {NODE_IMAGE: '${NODE_IMAGE:?}'}
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777', '/app/.next/cache:rw,nosuid,nodev,noexec,size=32m,uid=1000,gid=1000']
    mem_limit: 384m
    cpus: 0.75
  hub-cleanup:
    <<: *service
    image: forgeflow-showcase-hub-api:${RELEASE_ID:?}
    env_file: [/etc/forgeflow/showcase/knowledge.env]
    command:
      - python
      - -c
      - |
        import subprocess, time
        while True:
            subprocess.run(['python', '-m', 'app.manage', 'cleanup'], check=True)
            time.sleep(3600)
    mem_limit: 128m
    cpus: 0.25
  flow-api:
    <<: *service
    image: forgeflow-showcase-flow-api:${RELEASE_ID:?}
    build:
      context: ./flow-api
      dockerfile: Dockerfile
      args: {PYTHON_IMAGE: '${PYTHON_IMAGE:?}'}
    env_file: [/etc/forgeflow/showcase/flowpilot.env]
    command: [python, -m, uvicorn, 'flowpilot.suite_gateway:create_gateway', --factory, --host, 127.0.0.1, --port, '8001', --no-access-log, --no-proxy-headers]
    mem_limit: 256m
    cpus: 0.5
  flow-worker:
    <<: *service
    image: forgeflow-showcase-flow-api:${RELEASE_ID:?}
    env_file: [/etc/forgeflow/showcase/flowpilot.env]
    command: [python, -m, flowpilot.suite_worker]
    mem_limit: 256m
    cpus: 0.5
  pulsewatch-api:
    <<: *service
    image: forgeflow-showcase-pulsewatch-api:${RELEASE_ID:?}
    build:
      context: ./pulsewatch/backend
      dockerfile: Dockerfile.suite
      args:
        MAVEN_IMAGE: '${MAVEN_IMAGE:?}'
        JAVA_IMAGE: '${JAVA_IMAGE:?}'
    env_file: [/etc/forgeflow/showcase/pulsewatch.env]
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8082/api/v1/health]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
  pulsewatch-web:
    <<: *service
    image: forgeflow-showcase-pulsewatch-web:${RELEASE_ID:?}
    user: '101:101'
    build:
      context: ./pulsewatch
      dockerfile: infra/Dockerfile.suite-frontend
      args:
        NODE_IMAGE: '${NODE_IMAGE:?}'
        NGINX_IMAGE: '${NGINX_IMAGE:?}'
    tmpfs:
      - '/tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777'
      - '/var/cache/nginx:rw,nosuid,nodev,noexec,size=16m,mode=755,uid=101,gid=101'
      - '/run:rw,nosuid,nodev,noexec,size=8m,mode=755,uid=101,gid=101'
    mem_limit: 96m
    cpus: 0.25
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:3302/]
      interval: 10s
      timeout: 3s
      retries: 6
  datascout-api:
    <<: *service
    image: forgeflow-showcase-datascout-api:${RELEASE_ID:?}
    build:
      context: ./datascout/backend
      dockerfile: Dockerfile
      target: runtime
      args: {PYTHON_IMAGE: '${PYTHON_IMAGE:?}'}
    env_file: [/etc/forgeflow/showcase/datascout.env]
    command: [uvicorn, 'app.suite_gateway:create_suite_app', --factory, --host, 127.0.0.1, --port, '8002', --no-access-log, --no-proxy-headers]
    mem_limit: 192m
    cpus: 0.5
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  datascout-worker:
    <<: *service
    image: forgeflow-showcase-datascout-api:${RELEASE_ID:?}
    env_file: [/etc/forgeflow/showcase/datascout.env]
    command: [python, -m, app.suite_worker]
    mem_limit: 128m
    cpus: 0.5
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, python, -m, app.scheduling.worker_health]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
  redis:
    <<: *service
    image: ${REDIS_IMAGE:?}
    user: '10001:10001'
    command: [redis-server, /run/redis.conf]
    volumes:
      - /etc/forgeflow/showcase/redis.conf:/run/redis.conf:ro
      - /var/lib/forgeflow-showcase/redis:/data
    mem_limit: 192m
    cpus: 0.25
